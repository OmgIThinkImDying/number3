<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Number2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 550px;
            width: 100%;
            background: rgba(15, 15, 25, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 40px 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 200, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: scale(1.01);
        }

        .title {
            text-align: center;
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 0%, #ffcc00 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 10px rgba(255, 200, 0, 0.3);
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .number-card {
            background: linear-gradient(135deg, #1e1e2e 0%, #2a2a3a 100%);
            border-radius: 24px;
            padding: 30px 20px;
            margin-bottom: 30px;
            text-align: center;
            border: 1px solid rgba(255, 200, 0, 0.4);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .number-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .phone-number {
            font-size: 32px;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            color: #ffcc00;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 20px;
            border-radius: 16px;
            display: inline-block;
            letter-spacing: 2px;
            margin-bottom: 20px;
            word-break: break-all;
        }

        .copy-btn {
            background: linear-gradient(135deg, #ffcc00 0%, #ff9900 100%);
            border: none;
            padding: 14px 32px;
            font-size: 18px;
            font-weight: 700;
            color: #1a1a2e;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: auto;
            min-width: 200px;
            box-shadow: 0 5px 15px rgba(255, 200, 0, 0.3);
        }

        .copy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 200, 0, 0.4);
            background: linear-gradient(135deg, #ffdd33 0%, #ffaa22 100%);
        }

        .copy-btn:active {
            transform: translateY(1px);
        }

        .copy-btn.copied {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            box-shadow: 0 5px 15px rgba(34, 197, 94, 0.3);
        }

        .copy-icon {
            font-size: 20px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #22c55e;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 1000;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .toast.show {
            opacity: 1;
        }

        @media (max-width: 550px) {
            .container {
                padding: 25px 20px;
            }
            .title {
                font-size: 36px;
            }
            .phone-number {
                font-size: 24px;
                word-break: break-all;
            }
            .copy-btn {
                padding: 12px 24px;
                font-size: 16px;
                min-width: 170px;
            }
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 5px 15px rgba(255, 200, 0, 0.3);
            }
            50% {
                box-shadow: 0 5px 25px rgba(255, 200, 0, 0.6);
            }
        }

        .copy-btn {
            animation: pulse 2s infinite;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">NUMBER2</div>
        <div class="subtitle">контактный номер</div>

        <div class="number-card">
            <div class="number-label">телефон для связи</div>
            <div class="phone-number" id="phoneNumber">+7 906 186 42 55</div>
            <button class="copy-btn" id="copyBtn">
                <span class="copy-icon">📋</span>
                <span id="copyText">Копировать номер</span>
            </button>
        </div>

        <footer>
            number2
        </footer>
    </div>

    <div class="toast" id="toast">✅ Номер скопирован!</div>

    <script>
        (function() {
            const phoneNumber = "+7 906 186 42 55";
            const copyBtn = document.getElementById('copyBtn');
            const copyTextSpan = document.getElementById('copyText');
            const toast = document.getElementById('toast');
            
            const cleanNumber = phoneNumber.replace(/\s/g, '');
            
            async function copyNumber() {
                try {
                    await navigator.clipboard.writeText(cleanNumber);
                    showSuccess();
                } catch (err) {
                    fallbackCopy(cleanNumber);
                }
            }
            
            function fallbackCopy(text) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showSuccess();
                } catch (err) {
                    alert('Не удалось скопировать номер');
                }
                document.body.removeChild(textarea);
            }
            
            function showSuccess() {
                const originalText = copyTextSpan.innerText;
                copyTextSpan.innerText = 'Скопировано!';
                copyBtn.classList.add('copied');
                toast.classList.add('show');
                
                setTimeout(() => {
                    copyTextSpan.innerText = originalText;
                    copyBtn.classList.remove('copied');
                }, 2000);
                
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            }
            
            copyBtn.addEventListener('click', copyNumber);
            
            const phoneElement = document.getElementById('phoneNumber');
            if (phoneElement) {
                phoneElement.style.cursor = 'pointer';
                phoneElement.addEventListener('click', function() {
                    copyNumber();
                });
            }
        })();
    </script>
</body>
</html>
